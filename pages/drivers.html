<div class="driver">
    <h1 class="driver-title">Tài xế</h1>
    <div class="driver-top">
        <label for="addform" class="driver-top__addbutton addbutton">
            Thêm
        </label>
        <input
            type="checkbox"
            name="addform"
            id="addform"
            class="addform-checkbox"
        />
        <div class="addform"></div>
    </div>

    <table class="driver-table">
        <thead class="driver-table__head">
            <tr class="driver-table__row">
                <th>ID</th>
                <th>ID Công ty</th>
                <th>Tên</th>
                <th>Số điện thoại</th>
                <th>Căn cước</th>
                <th>Kinh nghiệm(Năm)</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody class="driver-table__body">
            <tr class="driver-table__row">
                <td>1</td>
                <td>1</td>
                <td>Nguyễn Văn A</td>
                <td>0123456789</td>
                <td>123456789</td>
                <td>5</td>
                <td>Hoạt động</td>
                <td>
                    <button class="driver-table__editbutton editbutton">
                        Sửa
                    </button>
                    <button class="driver-table__deletebutton deletebutton">
                        Xóa
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
