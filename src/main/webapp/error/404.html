<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm thấy trang - Chat System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Không tìm thấy trang</h2>
            <p>Trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển.</p>
            <a href="../index.html" class="btn btn-primary">Về trang chủ</a>
        </div>
    </div>
    
    <style>
        .error-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .error-content {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .error-content h1 {
            font-size: 120px;
            color: #667eea;
            margin: 0;
            line-height: 1;
        }
        
        .error-content h2 {
            font-size: 32px;
            color: #333;
            margin: 20px 0;
        }
        
        .error-content p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</body>
</html>
